@for (item of items; track item) {
  <div class="dataset-card">
    <div class="logo-container">
      <ng-container>
        <app-organization-logo [organizationId]="isItemLogo(item) ? item.pictoValue : null"
          cssClass="with-border"
          organizationType="producer"
          [defaultLogo]="getDefaultLogo(item)"
          >
        </app-organization-logo>
      </ng-container>
    </div>
    <div class="dataset-info">
      <div class="jdd-info-container">
        @if (item.overTitle) {
          <div
          class="dataset-info-organization_name">{{item.overTitle}}</div>
        }
        @if (item.title) {
          <div
            class="dataset-info-resource_title">
            @if (item.titleIcon) {
              <mat-icon class="dataset-info-title-icon" [svgIcon]="item.titleIcon"></mat-icon>
            }
            {{item.title}}
          </div>
        }
      </div>
    </div>
    <div class="dataset-actions">
      @if (item.editable) {
        <mat-icon class="rudi-icon-encircled" (click)="handleEdit(item)">edit</mat-icon>
      }
      <mat-icon class="rudi-icon-encircled" (click)="handleDelete(item)">delete</mat-icon>
    </div>
  </div>
}
