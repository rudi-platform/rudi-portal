@for (item of items; track item) {
  <div class="dataset-card">
    <div class="logo-container">
      <ng-container>
        <app-organization-logo [organizationId]="isItemLogo(item) ? item.pictoValue : null"
          cssClass="with-border"
          organizationType="producer"
          [defaultLogo]="getDefaultLogo(item)"
          [decorative]="true"
          >
        </app-organization-logo>
      </ng-container>
    </div>
    <div class="dataset-info">
      <div class="jdd-info-container">
        @if (item.overTitle) {
          <div
          class="dataset-info-organization_name">{{item.overTitle}}</div>
        }
        @if (item.title) {
          <div
            class="dataset-info-resource_title">
            @if (item.titleIcon) {
              @let titleIconLabelKey = getTitleIconLabelKey(item);
              <mat-icon class="dataset-info-title-icon" [svgIcon]="item.titleIcon"
                [attr.aria-hidden]="titleIconLabelKey ? 'false' : 'true'"
                [attr.aria-label]="titleIconLabelKey ? (titleIconLabelKey | translate) : null"></mat-icon>
            }
            {{item.title}}
          </div>
        }
      </div>
    </div>
    <div class="dataset-actions">
      @if (item.editable) {
        <button type="button" class="dataset-action-button" (click)="handleEdit(item)"
          [attr.aria-label]="'project.stepper.submission.step3.editItem' | translate: {title: item.title}">
          <mat-icon class="rudi-icon-encircled" aria-hidden="true">edit</mat-icon>
        </button>
      }
      <button #deleteButton type="button" class="dataset-action-button" (click)="handleDelete(item)"
        [attr.aria-label]="'project.stepper.submission.step3.removeItem' | translate: {title: item.title}">
        <mat-icon class="rudi-icon-encircled" aria-hidden="true">delete</mat-icon>
      </button>
    </div>
  </div>
}
