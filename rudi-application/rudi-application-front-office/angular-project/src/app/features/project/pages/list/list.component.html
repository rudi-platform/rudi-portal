<main id="main-content" tabindex="-1">
<mat-sidenav-container>
  <mat-sidenav-content>
    <div
            [ngClass]="{'project-container-sm': mediaSize.isSm  || mediaSize.isMd,
            'project-container-lg':  mediaSize.isLg, 'project-container-xl': mediaSize.isXl, 'project-container-xxl': mediaSize.isXxl}"
      class="project-container container-fluid ps-0 pe-0"
      >
      <app-page-title [title1]="'project.catalogue'|translate"
        [title2]="'project.reutilisations'|translate"
        [title3]="'project.reutilisationsSubtitle'|translate"
      class="d-flex justify-content-center w-100"></app-page-title>

      <!--Composant de recherche libre-->
      <app-search-box
        [mediaSize]="mediaSize"
        [libelle]="'searchbox.rechercherReutilisation'"
        (searchTermsEmitter)="freeText = $event.trim()"
        class="d-flex justify-content-center w-100">
      </app-search-box>

      <!--Composant reutilisation banner-->
      <app-banner [mediaSize]="mediaSize">

      </app-banner>

      <div
        [ngClass]="{'px-small': mediaSize.isXs || mediaSize.isSm, 'px-medium': mediaSize.isMd, 'px-large': mediaSize.isLg || mediaSize.isXl || mediaSize.isXxl}"
        class="mt-4">
        <div class="list-headers">
          <!--Nombre de résultats-->
          <output #resultsCount tabindex="-1" class=" w-50 search-count" aria-live="polite">
            @if (displayedTotal === 0) {
              <div>
                <span>{{ 'searchbox.noResult'|translate }}</span>
              </div>
            } @else if (displayedTotal) {
              <div>
                <span>{{ displayedTotal }} {{ 'searchbox.results'|translate }}{{ displayedTotal > 1 ? 's' : '' }}
                  @if (searchedTerm) {
                    {{ 'searchbox.resultsFor' | translate: resultsForParams }}
                  }
                </span>
              </div>
            }
          </output>

          <app-project-order [(order)]="order">
          </app-project-order>

        </div>

        <app-project-list (clickProject)="onClickProject($event)"
          (projectListChange)="onProjectListChange($event)"
          (pageLoaded)="resultsCount.focus()"
          [order]="order"
          [freeText]="freeText"
        ></app-project-list>

      </div>

    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
</main>
