<form class="w-100 d-flex" role="search">
  <div class="search-box-container w-100">
    <label [for]="inputId" class="visually-hidden">{{libelle | translate}}</label>
    <div class="search-zone d-flex align-items-center search-size">
      <span class="search-box-icon me-5 mt-1">
        <mat-icon class="me-2" aria-hidden="true" svgIcon="search"></mat-icon>
      </span>
      <input
        class="form-control text-indent"
        type="search"
        name="search"
        autocomplete="off"
        [id]="inputId"
        [(ngModel)]="searchTerms"
        (keydown.enter)="onChanges()"
        [placeholder]="libelle | translate"
        [attr.aria-label]="libelle | translate">
      @if (searchTerms) {
        <span class="search-box-clear search-box" [ngClass]="searchTerms ? 'active' : ''">
          <mat-icon
            class="pointer me-2"
            aria-hidden="false"
            [attr.aria-label]="'common.clearSearch' | translate"
            (click)="onReset()">close</mat-icon>
        </span>
      }
    </div>
  </div>
</form>
