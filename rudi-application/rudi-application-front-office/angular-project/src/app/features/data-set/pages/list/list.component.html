<main id="main-content" tabindex="-1">
<mat-sidenav-container>
  <!--  Liste des filtres-->
  <mat-sidenav #sidenav (keydown.escape)="sidenav.close()" disableClose>
    <app-filter-sidenav-container (closeSidenav)="sidenav.close()" titleKey="filterBox.filtres">

      <button #orderButton type="button" (click)="sidenavOrder.open(); sidenav.close()" class="rudi-sidenav-container-filter">
        {{'sortBox.sort'|translate}}
        <div>
          <mat-icon aria-hidden="true"
            class="toolbar-icon pointer" fontIcon="chevron_right"></mat-icon>
        </div>
      </button>

      @let themesCount = themesForm.counter$ | async;
      <button #themesButton type="button" (click)="sidenavThemes.open(); sidenav.close()" class="rudi-sidenav-container-filter"
        [matBadge]="themesCount"
        [matBadgeDescription]="themesCount ? ('filterBox.filtresSelectionnes' | translate: {count: themesCount}) : null">
        {{'filterBox.thematique'|translate}}
        <div>
          <mat-icon aria-hidden="true"
            class="toolbar-icon pointer" fontIcon="chevron_right"></mat-icon>
        </div>
      </button>

      @let producerNamesCount = producerNamesForm.counter$ | async;
      <button #producerNamesButton type="button" (click)="sidenavProducerNames.open(); sidenav.close()" class="rudi-sidenav-container-filter"
        [matBadge]="producerNamesCount"
        [matBadgeDescription]="producerNamesCount ? ('filterBox.filtresSelectionnes' | translate: {count: producerNamesCount}) : null">
        {{'filterBox.producteur'|translate}}
        <div>
          <mat-icon aria-hidden="true"
            class="toolbar-icon pointer" fontIcon="chevron_right"></mat-icon>
        </div>
      </button>

      @if (accessStatusfilterForcedValue === undefined) {
        @let restrictedAccessCount = restrictedAccessForm.counter$ | async;
        <button #restrictedAccessButton type="button" (click)="sidenavRestrictedAccess.open(); sidenav.close()"
          class="rudi-sidenav-container-filter bottom-border"
          [matBadge]="restrictedAccessCount"
          [matBadgeDescription]="restrictedAccessCount ? ('filterBox.filtresSelectionnes' | translate: {count: restrictedAccessCount}) : null"
          >
          {{'filterBox.restrictedAccess.statut'|translate}}
          <div>
            <mat-icon aria-hidden="true"
              class="toolbar-icon pointer" fontIcon="chevron_right"></mat-icon>
          </div>
        </button>
      }

      <div class="rudi-sidenav-container-footer mt-5">
        <button color="primary" type="submit" mat-raised-button class="rudi-blue-button"
          (click)="submitFilters()">
          {{'filterBox.toutEffacer'|translate}}
        </button>
      </div>
    </app-filter-sidenav-container>
  </mat-sidenav>

  <mat-sidenav #sidenavOrder (keydown.escape)="orderForm.revert(); backToFilters(sidenavOrder, orderButton)" disableClose>
    <app-filter-sidenav-container (closeSidenav)="orderForm.revert(); backToFilters(sidenavOrder, orderButton)"
      titleKey="sortBox.sort">
      <app-order-filter-form
        #orderForm
        [values]="orders"
        (submitFormEvent)="sidenavOrder.close()"
        ulClass="ps-5">
      </app-order-filter-form>
    </app-filter-sidenav-container>
  </mat-sidenav>

  <mat-sidenav #sidenavThemes (keydown.escape)="themesForm.revert(); backToFilters(sidenavThemes, themesButton)" disableClose>
    <app-filter-sidenav-container (closeSidenav)="themesForm.revert(); backToFilters(sidenavThemes, themesButton)"
      titleKey="filterBox.thematique">
      <app-themes-filter-form
        #themesForm
        (selectedItemsChange)="selectedThemeItems = $event"
        (submitFormEvent)="sidenavThemes.close()"
        [values]="themes"
        ulClass="ps-5">
      </app-themes-filter-form>
    </app-filter-sidenav-container>
  </mat-sidenav>

  <mat-sidenav #sidenavProducerNames (keydown.escape)="producerNamesForm.revert(); backToFilters(sidenavProducerNames, producerNamesButton)" disableClose>
    <app-filter-sidenav-container
      (closeSidenav)="producerNamesForm.revert(); backToFilters(sidenavProducerNames, producerNamesButton)"
      titleKey="filterBox.producteur">
      <app-producer-names-filter-form
        #producerNamesForm
        (selectedItemsChange)="selectedProducerItems = $event"
        (submitFormEvent)="sidenavProducerNames.close()"
        [values]="producerNames"
        ulClass="ps-5">
      </app-producer-names-filter-form>
    </app-filter-sidenav-container>
  </mat-sidenav>


  <mat-sidenav #sidenavRestrictedAccess (keydown.escape)="restrictedAccessForm.revert(); backToFilters(sidenavRestrictedAccess, restrictedAccessButton?.nativeElement)" disableClose>
    <app-filter-sidenav-container
      (closeSidenav)="restrictedAccessForm.revert(); backToFilters(sidenavRestrictedAccess, restrictedAccessButton?.nativeElement)"
      titleKey="filterBox.restrictedAccess.statut">
      <app-access-status-filter-form
        #restrictedAccessForm
        (selectedItemsChange)="selectedAccessStatusFilterItems = $event"
        (submitFormEvent)="sidenavRestrictedAccess.close()"
        [forcedValue]="accessStatusfilterForcedValue"
        ulClass="ps-5">
      </app-access-status-filter-form>
    </app-filter-sidenav-container>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="container-fluid"
      [ngClass]="{'p-small': mediaSize.isXs || mediaSize.isSm,'p-medium': mediaSize.isMd, 'p-large': mediaSize.isDeviceDesktop}">


      <app-page-title [title1]="'searchbox.catalogue'|translate"
        [title2]="'searchbox.jeuxDonnees'|translate"
        [title3]="'searchbox.catalogueSubtitle'|translate"
      class="d-flex justify-content-center w-100"></app-page-title>

      <app-list-container [accessStatusForcedValue]="accessStatusfilterForcedValue"
        [orders]="orders"
      [themes]="themes"></app-list-container>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
</main>
