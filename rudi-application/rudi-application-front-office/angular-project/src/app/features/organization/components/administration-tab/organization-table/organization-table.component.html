<!-- Robot table-->
<div class="table-robot">

    <div class="table-title-container">
        <h2 class="table-title-style">{{ 'metaData.administrationTab.organizationTitle' | translate }}</h2>
    </div>

    <app-loader [allPage]="false" [isLight]="true" [noText]="true" [active]="isLoading"></app-loader>

    <table
        [attr.aria-label]="'metaData.administrationTab.organizationTitle' | translate" mat-table
        [dataSource]="dataSource"
        class="mat-table-robot"
        [hidden]="isLoading">
        <!-- name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="table-header" scope="col">
                {{'metaData.administrationTab.robotTable.name'|translate}}
            </th>
            <td mat-cell class="blue-theme" *matCellDef="let element"> {{organization?.name}}</td>
        </ng-container>

        <!-- id -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="table-header center" scope="col">
                {{'metaData.administrationTab.robotTable.id'|translate}}
            </th>
            <td mat-cell class="center" *matCellDef="let element"> {{organization?.uuid}} </td>
        </ng-container>

        <!-- dash -->
        <ng-container matColumnDef="dash">
            <th mat-header-cell *matHeaderCellDef class="table-header" scope="col">
                <span class="visually-hidden">{{'metaData.administrationTab.actionsHeader'|translate}}</span>
            </th>
            <td mat-cell *matCellDef="let element">
                <button type="button" class="action-fab-btn-icon" mat-mini-fab [matMenuTriggerFor]="menu"
                    (menuClosed)="runPendingMenuAction()"
                    [attr.aria-label]="'metaData.administrationTab.actionsFor' | translate: {name: organization?.name}">
                    <mat-icon class="little-icon-size" aria-hidden="true" [svgIcon]="'dashes'"></mat-icon>
                </button>
                <mat-menu #menu="matMenu" xPosition="before" class="no-padding-menu">
                    <button mat-menu-item (click)="deferMenuAction('archive')">{{'metaData.administrationTab.robotTable.archive'|translate}}</button>
                    <button mat-menu-item (click)="deferMenuAction('modify')">{{'metaData.administrationTab.robotTable.modify'|translate}}</button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
