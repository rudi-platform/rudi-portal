<div class="card-description-keyword">
  <mat-card class="card">
    <mat-card-title class="card-demand-label">{{ 'personalSpace.requestDetail.details.new-data'|translate }}</mat-card-title>
    <app-loader [active]="loading" [allPage]="false" [isLight]="true" [noText]="true"></app-loader>
    @if (!loading) {
      <mat-card-content>
        @if (newDatasetRequest.creation_date) {
          <div class="vertical-space">
            <label class="data-label">{{ 'personalSpace.requestDetail.requestDate'|translate }}</label> <br>
            <span class="data-value">{{ newDatasetRequest.creation_date | date: 'dd/MM/yyyy' }}</span>
          </div>
        }
        @if (newDatasetRequest.description) {
          <div class="vertical-space">
            <label class="data-label">{{ 'personalSpace.requestDetail.comment'|translate }}</label> <br>
            <span class="data-value">{{ newDatasetRequest.description }}</span>
          </div>
        }
      </mat-card-content>
    }
  </mat-card>
</div>
