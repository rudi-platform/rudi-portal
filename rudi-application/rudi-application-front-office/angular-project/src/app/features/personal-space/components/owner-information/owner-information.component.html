<mat-card class="project-owner">
    <mat-card-title class="section-title">
        {{ title }}
    </mat-card-title>
    <mat-card-subtitle class="section-sub-title">
        {{ name }}
    </mat-card-subtitle>
    @if(email) {
    <mat-card-content class="section-content">
        <app-contact-button [email]="email" [showEmailDirectly]="true"></app-contact-button>
    </mat-card-content>
    }
</mat-card>
