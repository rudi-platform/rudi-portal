<div id="dialog-container">
    <mat-dialog-content>
        <div class="dialog-cross-button">
            <button mat-icon-button type="button" (click)="onClickClose()"
                [attr.aria-label]="'popup.close' | translate">
                <mat-icon svgIcon="icon-close" class="cross-button" aria-hidden="true"></mat-icon>
            </button>
        </div>

        <div class="dialog-content">
            <div class="dialog-title" mat-dialog-title>{{ title || ('personalSpace.organization.dialog.title'|translate) }}</div>
            <div class="dialog-description">{{ description || ('personalSpace.organization.dialog.description'|translate) }}</div>
            <div class="dialog-description">
                <span class="required-symbol">*</span>
                {{ 'personalSpace.organization.dialog.requiredFields'|translate }}
            </div>

            <app-organization-form #OrganizationForm
            [draftForm]="draftForm"
            [organization]="organization"
            [messageControlName]="messageControlName">
            </app-organization-form>

            <mat-dialog-actions class="dialog-buttons">
                <button class="secondary-raised-button" mat-raised-button type="button"
                        (click)="onClickClose()">
                    <span>{{ 'popup.cancel'|translate }}</span>
                </button>
                <button class="primary-raised-button" mat-raised-button type="button"
                        (click)="onClickConfirm()">
                    <span>{{ 'popup.confirm'|translate }}</span>
                </button>
            </mat-dialog-actions>
        </div>
    </mat-dialog-content>

</div>
