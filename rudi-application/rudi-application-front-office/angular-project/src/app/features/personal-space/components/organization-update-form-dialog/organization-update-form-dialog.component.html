<div id="dialog-container">
    <mat-dialog-content>
        <div class="dialog-cross-button">
            <button mat-icon-button (click)="onClickClose()">
                <mat-icon svgIcon="icon-close" class="cross-button"></mat-icon>
            </button>
        </div>

        <div class="dialog-content">
            <div class="dialog-title">{{ title || ('personalSpace.organization.dialog.title'|translate) }}</div>
            <div class="dialog-description">{{ description || ('personalSpace.organization.dialog.description'|translate) }}</div>
            <div class="d-flex required-info">
                <span class="required-symbol">*</span>
                <span class="ms-1">{{ 'personalSpace.organization.dialog.requiredFields'|translate }}</span>
            </div>

            <app-workflow-form #WorkflowForm
                [workflowForm]="draftForm"
                [properties]="properties"
            ></app-workflow-form>

            <mat-dialog-actions class="dialog-buttons">
                <button class="secondary-raised-button" mat-raised-button
                        (click)="onClickClose()">
                    <span>{{ 'popup.cancel'|translate }}</span>
                </button>
                <button class="primary-raised-button" mat-raised-button
                        [disabled]="!isValidForm()" (click)="onClickConfirm()">
                    <span>{{ 'popup.confirm'|translate }}</span>
                </button>
            </mat-dialog-actions>
        </div>
    </mat-dialog-content>

</div>
