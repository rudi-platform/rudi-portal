<!-- Le loader de Rudi est par défaut sur toute la page (all-page-loading) -->
@if (active) {
  <div class="loader-inner line-scale custom-loader"
    [ngClass]="[getCssClass(), getAllPageClass()]"
    >
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    @if (isWithText()) {
      <small [ngClass]="getCssClass()"><br/>{{ description }}</small>
    }
  </div>
}
