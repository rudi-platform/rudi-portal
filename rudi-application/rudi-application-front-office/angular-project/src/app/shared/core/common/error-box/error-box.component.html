<!-- Always rendered after an action or a failed load: announce it to screen readers -->
<div class="error-zone" role="alert">
  <div class="icon-container">
    <mat-icon class="error-icon" fontIcon="error" aria-hidden="true"></mat-icon>
  </div>
  <!-- Bloc erreur textuel -->
  @if (hasText()) {
    <div>
      <!-- le texte de l'erreur -->
      <span>{{text}}</span>
      <!-- le texte cliquable -->
      @if (hasClickableText()) {
        <button type="button" class="error-clickable"
        (click)="handleClickClickableText()">{{clickableText}}</button>
      }
      <span>{{textAfterLink}}</span>
    </div>
  }
</div>
