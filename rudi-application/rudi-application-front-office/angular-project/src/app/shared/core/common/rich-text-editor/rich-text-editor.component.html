<span class="visually-hidden" [id]="shortcutsHintId">{{ 'common.richTextEditorShortcuts' | translate }}</span>
<ckeditor
    [config]="config"
    [editor]="editor"
    [data]="data"
    [disabled]="isDisabled"
    (change)="onEditorChange($event)"
    (blur)="onEditorBlur()"
    (ready)="onEditorReady($event)"
>
</ckeditor>
