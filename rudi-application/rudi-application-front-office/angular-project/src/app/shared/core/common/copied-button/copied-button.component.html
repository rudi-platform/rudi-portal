<div class="main-container">
  <button type="button" class="btn-action" (click)="clickOnButton()"
    mat-raised-button>
    <span class="input-and-icon" [title]="getInputTitle()">
      <span class="visually-hidden">{{ 'common.copiedButton.copy' | translate }}</span>
      @if (hidePassword) {
        <span class="fake-input" aria-hidden="true">{{ getMaskedValue() }}</span>
        <span class="visually-hidden">{{ 'common.copiedButton.maskedValue' | translate }}</span>
      } @else {
        <span class="fake-input">{{ toCopy }}</span>
      }
      <mat-icon class="copy-icon-button" aria-hidden="true"
        [fontIcon]="copiedSuccess ? 'done_all' : 'content_copy'"></mat-icon>
    </span>
  </button>
  @if (masked) {
    <button type="button" class="floating-icon-visibility"
      [attr.aria-label]="'common.copiedButton.showValue' | translate"
      [attr.aria-pressed]="!hidePassword"
      (click)="hidePassword = !hidePassword">
      <mat-icon aria-hidden="true" [fontIcon]="hidePassword ? 'visibility' : 'visibility_off'"></mat-icon>
    </button>
  }
</div>
