<ng-container [formGroup]="formGroup">
  <div class="checkbox-container">
    <div class="checkbox-area">
      <mat-checkbox [formControlName]="formControlName"></mat-checkbox>
    </div>
    <div class="label-area">
      <div class="d-inline">
        <mat-label [innerHTML]="safeLabel">
        </mat-label>
        @if (required) {
          <span class="required-symbol">*</span>
        }
      </div>
      <mat-hint class="title-hint">{{help}}</mat-hint>
      @if (formControl.touched && formControl.errors) {
        <mat-error>
          <em class="fa fa-info-circle fa-2x me-2"></em>{{'common.requiredCheckboxError'|translate}}
        </mat-error>
      }
    </div>
  </div>
</ng-container>
