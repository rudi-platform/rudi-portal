<div>
  <div class="close-container">
    <button type="button" class="close-button" (click)="handleClose()" [attr.aria-label]="'popup.close' | translate">
      <mat-icon aria-hidden="true" fontIcon="close"></mat-icon>
    </button>
  </div>
  @if (properties) {
    <ul>
      @for (key of keys; track key) {
        <li>
          {{key}} : {{value(key)}}
        </li>
      }
    </ul>
  }
</div>
