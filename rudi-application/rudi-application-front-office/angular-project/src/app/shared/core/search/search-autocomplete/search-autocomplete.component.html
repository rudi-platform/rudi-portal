<div>
  <label for="search-autocomplete-input" class="visually-hidden">{{placeholder}}</label>
  <div class="input-and-loader">
    <input type="text" class="form-control text-indent"
      id="search-autocomplete-input"
      [placeholder]="placeholder"
      [formControl]="formControl"
      [matAutocomplete]="auto"
      [title]="formControl.value"
      [attr.aria-label]="placeholder"
      autocomplete="off"
      >
      @if (loading) {
        <div class="spinner-on-input">
          <mat-spinner [diameter]="20"></mat-spinner>
        </div>
      }
    </div>
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="setSelectedItem($event.option.value)">
      @for (item of autocompleteItems; track item) {
        <mat-option
          [value]="item"
          [title]="item.label"
          >
          {{item.label}}
        </mat-option>
      }
    </mat-autocomplete>
  </div>
