<form class="w-100 d-flex">
  <div class="search-box-container w-100">
    <label for="search-input" class="visually-hidden">{{libelle | translate}}</label>
    <!--   search zone-->
    <div class="search-zone d-flex d-flex align-items-center"
      [ngClass]="{'search-zone-sm': mediaSize.isSm, 'search-zone-md': mediaSize.isMd, 'search-zone-lg':  mediaSize.isLg || mediaSize.isXl || mediaSize.isXxl}">
      <span class="search-box-icon me-5 mt-1">
        <mat-icon class="me-2" aria-hidden="true" svgIcon="search"></mat-icon>
      </span>
      <input class="form-control text-indent" type="search" name="search" autocomplete="off"
        id="search-input"
        [(ngModel)]="searchTerms"
        (keydown.enter)="onChanges()"
        [placeholder]="libelle | translate"
        [attr.aria-label]="libelle | translate">
        @if (searchTerms) {
          <span class="search-box-clear" [ngClass]="searchTerms ? 'active' : ''">
            <mat-icon class="pointer me-2" aria-hidden="false" [attr.aria-label]="'common.clearSearch'|translate"
            (click)="onReset()">close</mat-icon>
          </span>
        }
      </div>

    </div>
  </form>
