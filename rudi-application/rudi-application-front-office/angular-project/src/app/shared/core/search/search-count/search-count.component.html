@if (searchIsRunning) {
  {{'searchbox.searchIsRunning'|translate}}
}
@if (!searchIsRunning) {
  @if (count) {
    {{count}} {{resultMessage | translate}}@if (isDefaultText) {
    <span>{{count > 1 ? 's' : ''}}</span>
  }
}
@if (!count) {
  {{noResultMessage}} @if (hasLink) {
  <span
    [routerLink]="routerLink"
  class="link"> {{hyperLink}} </span>
}
}
}
