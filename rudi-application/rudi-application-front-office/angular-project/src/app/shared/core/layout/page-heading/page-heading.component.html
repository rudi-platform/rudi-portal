<div class="header-metadata" [ngClass]="{
                'p-small': mediaSize.isDeviceMobile,
                'p-large': mediaSize.isDeviceDesktop
            }">

  <div class="header-img-container mb-sm-2">
    <div class="header-img">
            <app-organization-logo [ngClass]="{'metadata-theme-sm' : mediaSize.isSm,
                                                    'metadata-theme-md' : mediaSize.isMd,
                                                    'metadata-theme-lg' : mediaSize.isLg || mediaSize.isXl || mediaSize.isXxl}"
        class="organization-logo"
        [organizationId]="organizationId"
        [decorative]="!!resourceTitle"
        organizationType="producer">
      </app-organization-logo>
    </div>
  </div>

  <div class="header-ressource-container">
    <div class="header-ressource">
      <div class="producer-name">{{organizationName}}</div>
      <div class="resource-description d-flex mx-auto">
        <h1 class="blue-theme resource-title my-auto">
          @if (icon != null && icon !== '') {
            <mat-icon class="d-inline-flex dataset-icon picto" [svgIcon]="icon"
              [attr.aria-hidden]="iconAlt ? 'false' : 'true'"
              [attr.aria-label]="iconAlt || null"
              [attr.title]="iconAlt || null"
            ></mat-icon>
          }
          {{resourceTitle}}
        </h1>
      </div>
      @if (!mediaSize.isXs && status) {
        <div class="fake-btn">{{ status }}</div>
      }
    </div>
  </div>
</div>
