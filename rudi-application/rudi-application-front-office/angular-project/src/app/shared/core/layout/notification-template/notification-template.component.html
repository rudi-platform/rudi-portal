<div class="row">
    <div class="col-1">
        <em class="fa {{faIcon}} notif-icon-style me-2" aria-hidden="true"></em>
    </div>
    <div class="col-10">
        <mat-label [innerHTML]="data.message"></mat-label>
    </div>
    <div class="col-1 text-end" [ngClass]="{'block-icon-close': mediaSize.isDeviceMobile}">
        <button type="button" class="close-button" [attr.aria-label]="'popup.close' | translate" (click)="snackBarRef.dismiss()">
            <em class="fa fa-times notif-icon-style" aria-hidden="true"></em>
        </button>
    </div>
</div>
