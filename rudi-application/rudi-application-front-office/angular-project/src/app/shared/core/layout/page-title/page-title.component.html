<div class="page-title-container">
    <h1 class="search-box-title d-flex align-items-center justify-content-center w-100"
         [class]="{'search-box-title-sm': mediaSize.isDeviceMobile, 'search-box-title-lg':  mediaSize.isDeviceDesktop }">
        {{title1}} <span class="ms-2"> {{title2}}</span>
    </h1>
    <div class="subtitle-3 d-flex align-items-center justify-content-center w-100"> {{title3}}</div>
    @if (title4 && urlToDoc) {
        <a class="nav-link subtitle-4" [href]="urlToDoc"
            target="_blank" rel="noopener noreferrer">
                <span>{{title4}}</span>
                <span class="visually-hidden"> - {{'pageTitle.urlToDoc' | translate}}</span>
            </a>
    }
</div>
