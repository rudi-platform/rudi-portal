<div class="row error-zone">
    <div class="col-1">
        <em class="fa fa-exclamation-circle fa-2x notif-icon-style me-2" aria-hidden="true"></em>
    </div>
    <div class="col-10">
        <span>{{'snackbarTemplate.resetPasswordError'|translate}}
            <a class="pointer text-underline link-color"
               routerLink="/login/forgot-password"
               (click)="snackBarRef.dismiss()">{{'common.ici'|translate}}</a></span>
    </div>
    <div class="col-1 text-end" [ngClass]="{'block-icon-close': mediaSize.isDeviceMobile}">
        <button type="button" class="close-button me-2" [attr.aria-label]="'popup.close' | translate" (click)="snackBarRef.dismiss()">
            <em class="fa fa-times notif-icon-style" aria-hidden="true"></em>
        </button>
    </div>
</div>
