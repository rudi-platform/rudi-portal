<div [formGroup]="form" class="captcha-container">
    <div class="captcha-image-row">
        <img [src]="imageSrc" [alt]="'authentification.captchaImageAlt' | translate" class="captcha-image"/>

        <div class="captcha-buttons">
            <button type="button" [title]="audioTitle" class="captcha-btn" (click)="playCaptchaSound()">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 75 75">
                    <path d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z"
                          style="stroke:#111;stroke-width:5;stroke-linejoin:round;fill:#111;"/>
                    <path d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6"
                          style="fill:none;stroke:#111;stroke-width:5;stroke-linecap:round"/>
                </svg>
            </button>

            <button type="button" [title]="reloadTitle" class="captcha-btn" (click)="reloadCaptcha()">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 17 20" fill="none">
                    <path d="M9 4c2.1 0 4.1.8 5.6 2.3 3.1 3.1 3.1 8.2 0 11.3-1.8 1.9-4.3 2.6-6.7 2.3l.5-2c1.7.2 3.5-.4 4.8-1.7 2.3-2.3 2.3-6.1 0-8.5C12.1 6.6 10.5 6 9 6v4.6L4 5.6 9 .6V4zM3.3 17.6C.7 15 .3 11 2.1 7.9l1.5 1.5c-1.1 2.2-.7 5 1.2 6.8.5.5 1.1.9 1.8 1.2l-.6 2c-1-.4-1.9-1-2.7-1.8z"
                          fill="black"/>
                </svg>
            </button>
        </div>
    </div>

    <label for="captchaFormulaireExtInput" class="sr-only">{{'authentification.captchaImageAlt' | translate}}</label>
    <input
        type="text"
        id="captchaFormulaireExtInput"
        name="captchaFormulaireExtInput"
        class="captcha-input"
        [formControlName]="FORM_CONTROL_CAPTCHA">
</div>
