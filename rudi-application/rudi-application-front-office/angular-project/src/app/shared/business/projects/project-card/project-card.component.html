<mat-card [ngClass]="ngClass" class="mat-elevation-z4 project-card" appStretchedLinkClick>
    <a
        class="stretched-link"
        [routerLink]="detailUrl"
        [attr.aria-label]="projectTitle">
    </a>
    <img mat-card-image [src]="projectPicture" alt="">
    <mat-card-content>
        <div class="project-card-content">
            <app-truncated-text class="project-card-producer" [text]="projectOwnerInfo" [lines]="1" [focusable]="false"></app-truncated-text>
        </div>
        @if (titleLevel === 3) {
            <h3 class="project-card-heading">
                <ng-container [ngTemplateOutlet]="cardTitle"></ng-container>
            </h3>
        } @else {
            <h2 class="project-card-heading">
                <ng-container [ngTemplateOutlet]="cardTitle"></ng-container>
            </h2>
        }
        <ng-template #cardTitle>
            <app-truncated-text class="project-card-title" [text]="projectTitle" [lines]="3" [focusable]="false"></app-truncated-text>
        </ng-template>
        <div class="mt-1">
            <app-truncated-text class="project-card-summary" [text]="projectDescription" [lines]="3" [focusable]="false"></app-truncated-text>
        </div>
    </mat-card-content>
</mat-card>
