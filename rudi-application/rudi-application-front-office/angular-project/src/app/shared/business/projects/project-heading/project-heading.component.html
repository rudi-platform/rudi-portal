<div class="project-heading-container">
  <div class="image-container">
    <img [src]="logo" alt="" mat-card-image>
  </div>
  <div class="main-container">
    <p class="owner-description">{{ownerDescription | replaceIfNullPipe}}</p>
    <h1 class="blue-theme">{{projectTitle | replaceIfNullPipe}}</h1>
    @if (!mediaSize.isXs) {
      <div class="fake-btn">{{status | replaceIfNullPipe}}</div>
    }
  </div>

</div>
@if (mediaSize.isXs) {
  <div class="fake-btn-mobile">{{status | replaceIfNullPipe}}</div>
}
