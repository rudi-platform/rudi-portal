@if (!emailIsVisible && !showEmailDirectly) {
  <button class="button" (click)="clickContactButton()"
  mat-raised-button>{{ label ?? ('metaData.contact' | translate) }}</button>
}
@if (emailIsVisible || showEmailDirectly) {
  <button class="button email" (click)="clickEmailButton()"
    mat-raised-button>
    <span>{{email}}</span>
    @if (!copiedSuccess) {
      <mat-icon>content_copy</mat-icon>
    }
    @if (copiedSuccess) {
      <mat-icon>done_all</mat-icon>
    }
  </button>
}
