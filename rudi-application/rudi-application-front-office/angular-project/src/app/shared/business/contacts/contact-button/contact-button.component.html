@if (!emailIsVisible && !showEmailDirectly) {
  <button type="button" class="button" (click)="clickContactButton()"
  mat-raised-button>{{ label ?? ('metaData.contact' | translate) }}</button>
}
@if (emailIsVisible || showEmailDirectly) {
  <button #emailButton type="button" class="button email" (click)="clickEmailButton()"
    mat-raised-button>
    <span class="visually-hidden">{{ 'common.copiedButton.copy' | translate }}</span>
    <span>{{email}}</span>
    <mat-icon aria-hidden="true" [fontIcon]="copiedSuccess ? 'done_all' : 'content_copy'"></mat-icon>
  </button>
}
