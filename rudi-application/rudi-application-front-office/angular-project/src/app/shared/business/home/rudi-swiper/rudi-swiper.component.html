<div class="swiper-container">
    <section class="swiper {{ containerName }}" [attr.aria-label]="ariaLabel || null" aria-roledescription="carrousel">
        <button type="button" class="swiper-button-prev" [attr.aria-label]="'common.swiper.previousSlide' | translate">
            <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </button>
        <div #swiperWrapper class="swiper-wrapper">
            <ng-content></ng-content>
        </div>
        <button type="button" class="swiper-button-next" [attr.aria-label]="'common.swiper.nextSlide' | translate">
            <mat-icon aria-hidden="true">chevron_right</mat-icon>
        </button>
        <div #liveRegion class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    </section>
</div>
