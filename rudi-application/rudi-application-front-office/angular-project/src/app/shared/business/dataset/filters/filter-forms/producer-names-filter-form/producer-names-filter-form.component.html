@if (formGroup) {
  <form [formGroup]="formGroup" class="filter-child">
    <div class="filter-child-form">
      <ul [class]="ulClass" [formArrayName]="formArrayName">
        @for (producerName of items; track producerName; let i = $index) {
          <li [formGroupName]="i">
            <mat-checkbox
              [checked]="isChecked(producerName)"
              [value]="producerName.value"
              class="rudi-checkbox"
              formControlName="checked"
              >{{producerName.value}}
            </mat-checkbox>
          </li>
        }
      </ul>
    </div>
    <div class="rudi-select-panel-footer">
      <button
        color="primary"
        (click)="submitForm()"
        class="rudi-blue-button"
        mat-raised-button
        type="submit"
        [disabled]="!submitIsEnabled"
        >
        {{'common.appliquer'| translate }}
      </button>
    </div>
  </form>
}
