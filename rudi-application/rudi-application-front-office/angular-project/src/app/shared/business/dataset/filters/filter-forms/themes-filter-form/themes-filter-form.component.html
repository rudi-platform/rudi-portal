@if (formGroup) {
  <form [formGroup]="formGroup" class="filter-child">
    <div class="filter-child-form">
      <ul [class]="ulClass" [formArrayName]="formArrayName">
        @for (theme of items; track theme; let i = $index) {
          <li [formGroupName]="i">
            <mat-checkbox
              [checked]="isChecked(theme)"
              [value]="theme.value"
              class="rudi-checkbox"
              formControlName="checked"
              >{{theme.name}}
            </mat-checkbox>
          </li>
        }
      </ul>
    </div>
    <div class="rudi-select-panel-footer">
      <button
        color="primary"
        (click)="submitForm()"
        class="rudi-blue-button"
        mat-raised-button
        type="submit"
        [disabled]="!submitIsEnabled"
      >{{'common.appliquer'| translate}}</button>
    </div>
  </form>
}
