@if (!isHidden) {
  <button mat-raised-button
    [matMenuTriggerFor]="matMenu"
    #matMenuTrigger="matMenuTrigger"
    class="button rudi-select-button"
    [ngClass]="menuIsOpened ? 'active' : ''"
    (onMenuOpen)="onMenuOpen()"
    (onMenuClose)="onMenuClose()"
    [matBadge]="counter$ | async"
    >
    {{buttonTextKey | translate}}
    <mat-icon aria-hidden="true" iconPositionEnd class="rudi-select-arrow">
      @if (!menuIsOpened) {
        keyboard_arrow_down
      }
      @if (menuIsOpened) {
        keyboard_arrow_up
      }
    </mat-icon>
    <mat-menu #matMenu="matMenu" yPosition="below" class="rudi-menu">
      <div class="rudi-select-panel d-flex flex-column" (click)="$event.stopPropagation();">
        <ng-content></ng-content>
      </div>
    </mat-menu>
  </button>
}
