<mat-toolbar
             class="rudi-filters-toolbar" [ngClass]="{'filters-hidden': mediaSize.isXs || mediaSize.isSm || mediaSize.isMd}">

    <app-button-disclosure
        #themesMenu
        (closed)="themesForm.revert()"
        [counter$]="themesForm.counter$"
        triggerClass="button rudi-select-button"
        buttonTextKey="filterBox.thematique">
        <app-themes-filter-form
            #themesForm
            (selectedItemsChange)="selectedThemeItemsChange.emit($event)"
            (submitFormEvent)="themesMenu.close()"
            [values]="themes"
            ulClass="ps-0">
        </app-themes-filter-form>
    </app-button-disclosure>

    <app-button-disclosure
        #producerNamesMenu
        (closed)="producerNamesForm.revert()"
        [counter$]="producerNamesForm.counter$"
        triggerClass="button rudi-select-button"
        buttonTextKey="filterBox.producteur">
        <app-producer-names-filter-form
            #producerNamesForm
            (selectedItemsChange)="selectedProducerItemsChange.emit($event)"
            (submitFormEvent)="producerNamesMenu.close()"
            [values]="producerNames"
            ulClass="ps-0">
        </app-producer-names-filter-form>
    </app-button-disclosure>


    <app-button-disclosure
        #accessStatusMenu
        (closed)="AccessStatusForm.revert()"
        [counter$]="AccessStatusForm.counter$"
        [isHidden]="accessStatusForcedValue !== undefined"
        triggerClass="button rudi-select-button"
        buttonTextKey="filterBox.restrictedAccess.statut">
        <app-access-status-filter-form
            #AccessStatusForm
            (selectedItemsChange)="selectedAccessStatusItemsChange.emit($event);"
            (submitFormEvent)="accessStatusMenu.close()"
            [forcedValue]="accessStatusForcedValue"
            [hiddenValues]="accessStatusHiddenValues"
            ulClass="ps-0">
        </app-access-status-filter-form>
    </app-button-disclosure>

    <span class="spacer"></span>

    @if (datasetPublishButtonHtml) {
        <div class="dataset-publish-button-desktop" [innerHTML]="datasetPublishButtonHtml"></div>
    }
</mat-toolbar>

@if ((mediaSize.isXs || mediaSize.isSm || mediaSize.isMd) && datasetPublishButtonHtml) {
    <div class="dataset-publish-button-mobile" [innerHTML]="datasetPublishButtonHtml"></div>
}
