<div class="pointer d-flex justify-content-end sort-component">

  <!--Choix du tri-->
  <button (menuClosed)="toggleMenu()"
    (menuOpened)="toggleMenu()"
    [matMenuTriggerFor]="sortMenu"
    class="button rudi-simple-menu-button"
    disableRipple="true"
    mat-button
    >
    @if (selectedItems?.length) {
      {{'sortBox.orderedBy'|translate|uppercase}} :
      <span class="selected-in-button aligned">
        {{ selectedItems[0].name }}
      </span>
    }
    @if (!selectedItems || !selectedItems.length) {
      {{'sortBox.sort'|translate|uppercase}}
    }
    <mat-icon aria-hidden="true" iconPositionEnd class="rudi-select-arrow">
      @if (!menuIsOpened) {
        keyboard_arrow_down
      }
      @if (menuIsOpened) {
        keyboard_arrow_up
      }
    </mat-icon>
    <mat-menu #sortMenu="matMenu" class="rudi-sort-menu" xPosition="after">
      <div class="rudi-select-panel d-flex flex-column">
        @for (orderItem of items; track orderItem) {
          <button (click)="order = orderItem.value"
            [ngClass]="{selected: isSelected(orderItem)}"
            mat-menu-item>
            {{orderItem.name}}
          </button>
        }
      </div>
    </mat-menu>
  </button>
</div>
