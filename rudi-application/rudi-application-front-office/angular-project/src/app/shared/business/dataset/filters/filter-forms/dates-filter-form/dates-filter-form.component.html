@if (formGroup) {
  <form (ngSubmit)="submitForm()" [class]="formClass"
    [formGroup]="formGroup">
    <label for="date-start-input" [class]="debutDivClass + 'mb-2'">{{'filterBox.dateDebutCouvertureTemporelle' | translate}}</label>
    <mat-form-field appearance="outline">
      <input
        [matDatepicker]="picker1"
        placeholder="JJ/MM/AAAA"
        formControlName="startDate"
        matInput
        readonly
        id="date-start-input"
        >
        <mat-datepicker-toggle [for]="picker1" matSuffix></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
      </mat-form-field>
      <label for="date-end-input" [class]="finDivClass + 'mb-2'">{{'filterBox.dateFinCouvertureTemporelle' | translate}}</label>
      <mat-form-field appearance="outline">
        <input
          [matDatepicker]="picker2"
          placeholder="JJ/MM/AAAA"
          formControlName="endDate"
          matInput
          readonly
          id="date-end-input"
          >
          <mat-datepicker-toggle [for]="picker2" matSuffix></mat-datepicker-toggle>
          <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
        <div class="rudi-select-panel-footer">
          <button
            color="primary"
            (click)="submitForm()"
            [disabled]="!submitIsEnabled"
            class="rudi-blue-button"
            mat-raised-button
            type="submit"
            >
            {{'common.appliquer'| translate}}
          </button>
        </div>
      </form>
    }
