<!DOCTYPE html>
<html lang="fr">
<head>
    <title>${projectName} - Demande de partenariat à une réutilisation refusée</title>
    <style type="text/css">
        body {
            font-family: Montserrat;
            font-size: 12px;
            color: #004680;
        }

        a {
            font-weight: bold;
            color: #004680;
        }

        a:hover {
            color: #004680;
        }
    </style>
</head>
<body style="font-family:Montserrat;font-size:12px;	color:#004680;">
<div>
    <p>Bonjour,</p>
    <p>
        Votre demande de partenariat à la réutilisation <a
                href="${urlServer}/projets/detail/${asset.uuid}">${asset.title}</a> a été refusée par <a
                href="${urlServer}/organization/detail/${organizationUuid}">${organizationName}</a> pour la raison
        suivante : <#if reason??><#if reason?matches(".*[.!?]$")>"${reason}"<#else>"${reason}."</#if></#if>
    </p>
    <p>
        À très bientôt, <br>
        L'équipe ${teamName} <br>
        <a href="${urlServer}">${urlServer}</a>
    </p>
</div>
</body>
</html>
